spring.application.name=timass-backend
server.port=8080

# ============================================================================
# CẤU HÌNH KẾT NỐI CƠ SỞ DỮ LIỆU MYSQL 8.x
# ============================================================================
spring.datasource.url=jdbc:mysql://localhost:3306/timass_db?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ============================================================================
# CẤU HÌNH HIBERNATE & SPRING DATA JPA
# ============================================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# ============================================================================
# CẤU HÌNH TIỀN TỐ API THEO AI_RULES.MD
# ============================================================================
server.servlet.context-path=/
