spring.application.name=timass-backend
server.port=8080

# ============================================================================
# CẤU HÌNH KẾT NỐI CƠ SỞ DỮ LIỆU MYSQL 8.x
# ============================================================================
# Lưu ý quan trọng:
# 1. createDatabaseIfNotExist=true: Tự động tạo CSDL timass_db nếu máy bạn chưa có.
# 2. allowPublicKeyRetrieval=true: Tương thích cơ chế xác thực caching_sha2_password của MySQL 8.x.
# 3. DB_PORT: Mặc định đặt 3307 (đúng theo cổng dịch vụ MySQL80 đang chạy trên máy bạn).
#    Nếu bạn chuyển sang cổng 3306, chỉ cần sửa số 3307 thành 3306 bên dưới.
# ============================================================================

# Cổng MySQL (Mặc định 3307 theo dịch vụ MySQL máy bạn, hoặc đổi sang 3306)
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/${DB_NAME:timass_db}?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true&characterEncoding=UTF-8

# Tài khoản quản trị MySQL (Mặc định: root)
spring.datasource.username=${DB_USERNAME:root}

# MẬT KHẨU MYSQL CỦA BẠN (Điền mật khẩu vào sau dấu =, nếu không có thì để trống)
spring.datasource.password=${DB_PASSWORD:nhotrinh1982}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ============================================================================
# CẤU HÌNH HIBERNATE & SPRING DATA JPA
# Tự động tạo/cập nhật bảng: nguoi_dung, quy_tac_lap, cong_viec, cong_viec_con
# ============================================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# ============================================================================
# CẤU HÌNH TIỀN TỐ API
# ============================================================================
server.servlet.context-path=/
